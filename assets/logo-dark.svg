<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="autocursor — cursorline and cursorcolumn that follow your pause">
  <title>autocursor — cursorline and cursorcolumn that follow your pause</title>

  <defs>
    <linearGradient id="ac-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- icon: an editor pane with the cursorline / cursorcolumn crosshair lit -->
  <g>
    <rect x="22" y="24" width="100" height="112" rx="12" fill="#2a2f3a" stroke="#3a4150" stroke-width="2"/>
    <rect x="24" y="70" width="96" height="22" fill="url(#ac-g)" opacity="0.28"/>
    <rect x="66" y="26" width="22" height="108" fill="url(#ac-g)" opacity="0.28"/>
    <rect x="66" y="70" width="22" height="22" fill="url(#ac-g)"/>
    <rect x="36" y="42" width="52" height="6" rx="3" fill="#4b5563"/>
    <rect x="36" y="56" width="34" height="6" rx="3" fill="#4b5563"/>
    <rect x="36" y="104" width="60" height="6" rx="3" fill="#4b5563"/>
    <rect x="36" y="118" width="40" height="6" rx="3" fill="#4b5563"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="92"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="50" letter-spacing="-1.5"
        fill="#f5f5f5">autocursor</text>

  <!-- tagline -->
  <text x="152" y="120"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="15"
        fill="#b5b5b5">cursorline that follows your pause</text>
</svg>
